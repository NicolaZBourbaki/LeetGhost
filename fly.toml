# fly.toml app configuration file generated for leetghost

app = "leetghost"
primary_region = "iad"

[build]

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # Override the database path to use the persistent volume
  ConnectionStrings__DefaultConnection = "Data Source=/data/leetghost.db"

# Ми прибрали [http_service], бо боту не потрібен відкритий порт ззовні.
# Telegram Bot API працює через вихідні HTTP-запити (Long Polling).

[[mounts]]
  source = "bot_data"
  destination = "/data"

[[vm]]
  memory = "256mb" # Зменшено до 256mb, щоб залізо вписувалося у Free Tier
  cpu_kind = "shared"
  cpus = 1